<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0c0f; color: #f1f3f6; }
body { font-family: ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif; }
.top { position: absolute; left: 96px; top: 70px; display: flex; align-items: center; gap: 36px; }
.top img { width: 148px; height: 148px; filter: drop-shadow(0 18px 36px rgb(34 140 160 / .45)); }

p { margin: 12px 0 0; font: 500 30px/1.3 -apple-system, BlinkMacSystemFont, sans-serif; color: #a0a7b2; }
.laptop { position: absolute; left: 70px; right: 70px; top: 330px; height: 340px; padding: 16px 16px 0; border-radius: 40px 40px 0 0;

.screen { position: relative; height: 100%; border-radius: 24px 24px 0 0; overflow: hidden;

.bar span { margin-right: 20px; font-weight: 400; } .bar b { margin-right: 22px; }

.fillet.l { left: 0; background: radial-gradient(circle at 100% 100%, transparent 25.5px, #000 26px); }
.fillet.r { right: 0; background: radial-gradient(circle at 0 100%, transparent 25.5px, #000 26px); }
